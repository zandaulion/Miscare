<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8A56" />
      <stop offset="100%" stop-color="#164E30" />
    </linearGradient>
    <linearGradient id="skin1b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="shirt1b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <filter id="shadow1b" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.25" flood-color="#052413" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bg1b)" />

  <!-- Soft background dynamic trail -->
  <path d="M 120 400 C 180 390, 240 415, 340 400" stroke="#6EE7B7" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  <circle cx="256" cy="220" r="170" fill="#A7F3D0" opacity="0.16" />

  <g filter="url(#shadow1b)">
    <!-- Motion lines next to waving hand -->
    <path d="M 370 145 C 385 155 385 175 375 185" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
    <path d="M 390 135 C 410 150 410 185 395 200" fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />

    <!-- Left Arm swinging naturally as walking -->
    <path d="M 195 285 C 160 305 140 330 145 370 C 150 385 175 385 180 365 C 185 335 205 310 215 285 Z" 
          fill="url(#skin1b)" />

    <!-- Right Arm waving high in friendly "Hello!" -->
    <path d="M 295 275 C 320 255 345 200 340 155 C 338 135 365 130 372 150 C 378 175 365 235 320 275 Z" 
          fill="url(#skin1b)" />
    <!-- Cute cartoon waving palm & fingers -->
    <circle cx="355" cy="142" r="22" fill="url(#skin1b)" />
    <circle cx="340" cy="132" r="8" fill="url(#skin1b)" />
    <circle cx="355" cy="124" r="8" fill="url(#skin1b)" />
    <circle cx="370" cy="128" r="8" fill="url(#skin1b)" />

    <!-- Cheerful, chubby body in soft sage/mint shirt -->
    <path d="M 185 295 C 170 355 175 420 210 438 C 230 448 282 448 304 438 C 338 420 342 355 328 295 C 315 260 197 260 185 295 Z" 
          fill="url(#shirt1b)" />

    <!-- Darker sage collar -->
    <path d="M 230 272 C 242 290 276 290 288 272" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />

    <!-- Cheerful round head slightly tilted inquisitively & happily -->
    <circle cx="258" cy="208" r="62" fill="url(#skin1b)" />

    <!-- Cozy wavy hair tuft -->
    <path d="M 224 168 C 234 140 260 143 272 150 C 288 143 300 153 296 170 C 280 160 240 158 224 168 Z" 
          fill="#334155" />

    <!-- Big friendly smiling eyes (open cartoon dots with twinkle) -->
    <ellipse cx="242" cy="206" rx="6.5" ry="9" fill="#1E293B" />
    <circle cx="244" cy="203" r="2.5" fill="#FFFFFF" />

    <ellipse cx="274" cy="206" rx="6.5" ry="9" fill="#1E293B" />
    <circle cx="276" cy="203" r="2.5" fill="#FFFFFF" />

    <!-- Eyebrows raised happily -->
    <path d="M 234 192 Q 242 186 250 192" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    <path d="M 266 192 Q 274 186 282 192" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />

    <!-- Big warm open mouth smile -->
    <path d="M 244 226 Q 258 248 272 226 Z" fill="#E11D48" />
    <path d="M 244 226 Q 258 248 272 226" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />

    <!-- Rosy cheeks -->
    <circle cx="228" cy="222" r="9" fill="#F87171" opacity="0.75" />
    <circle cx="288" cy="222" r="9" fill="#F87171" opacity="0.75" />
  </g>
</svg>
