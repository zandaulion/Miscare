<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8A56" />
      <stop offset="100%" stop-color="#1B5E39" />
    </linearGradient>
    <linearGradient id="sprout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Dynamic, gentle motion lines -->
  <circle cx="256" cy="140" r="44" fill="#FFFFFF" />
  
  <!-- Stylized moving person + leaf sprout motif (fluid, gentle, non-aggressive) -->
  <path d="M 256,200 C 220,200 180,230 180,280 C 180,340 230,370 256,410 C 282,370 332,340 332,280 C 332,230 292,200 256,200 Z" 
        fill="url(#sprout)" />
  
  <!-- Motion arcs -->
  <path d="M 140,260 C 120,290 120,330 145,360" 
        fill="none" stroke="#6EE7B7" stroke-width="20" stroke-linecap="round" opacity="0.8" />
  <path d="M 372,260 C 392,290 392,330 367,360" 
        fill="none" stroke="#6EE7B7" stroke-width="20" stroke-linecap="round" opacity="0.8" />
</svg>
