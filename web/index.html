<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2A7B4C" />
  <meta name="description" content="Mișcare — Exerciții de la 0, program fără fricțiuni, no shaming și adaptare continuă" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mișcare" />

  <title>Mișcare — Exerciții de la 0</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand">
      <img src="/icons/icon.svg" alt="Mișcare" class="brand-icon" />
      <div>
        <div class="brand-name">Mișcare</div>
        <div class="brand-tagline" data-i18n="De la 0, în ritmul tău">De la 0, în ritmul tău</div>
      </div>
    </div>
    <div id="device-badge" class="device-badge">
      <span>Verificare...</span>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="container" id="main-content">
    <!-- Rendered dynamically by routine-view, equipment-view, log-view, etc. -->
  </main>

  <!-- Toast Container for pwa-kit updates & user feedback -->
  <div class="toast-container" aria-live="polite"></div>

  <!-- Bottom Navigation -->
  <nav class="app-nav" aria-label="Navigare principală" data-i18n-label="Navigare principală" role="tablist">
    <button class="nav-item active" data-tab="today" aria-label="Sesiunea de azi" data-i18n-label="Sesiunea de azi" role="tab" aria-selected="true">
      <span class="nav-icon">🏃</span>
      <span data-i18n="Azi">Azi</span>
    </button>
    <button class="nav-item" data-tab="compendium" aria-label="Compendiu de exerciții" data-i18n-label="Compendiu de exerciții" role="tab" aria-selected="false">
      <span class="nav-icon">📖</span>
      <span data-i18n="Exerciții">Exerciții</span>
    </button>
    <button class="nav-item" data-tab="equipment" aria-label="Echipament" data-i18n-label="Echipament" role="tab" aria-selected="false">
      <span class="nav-icon">🎒</span>
      <span data-i18n="Echipament">Echipament</span>
    </button>
    <button class="nav-item" data-tab="progress" aria-label="Jurnal și Progres" data-i18n-label="Jurnal și Progres" role="tab" aria-selected="false">
      <span class="nav-icon">🌿</span>
      <span data-i18n="Progres">Progres</span>
    </button>
    <button class="nav-item" data-tab="settings" aria-label="Setări și Dispozitiv" data-i18n-label="Setări și Dispozitiv" role="tab" aria-selected="false">
      <span class="nav-icon">⚙️</span>
      <span data-i18n="Acces">Acces</span>
    </button>
  </nav>

  <!-- Main Application Entry Script -->
  <script type="module" src="/app.js"></script>
</body>
</html>
